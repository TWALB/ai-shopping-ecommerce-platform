server:
  port: 8080

spring:
  profiles:
    # 本地密钥等私密配置放在 application-local.yml（已在 .gitignore 中忽略，不会提交）
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: digital-mall
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/digital_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置（生产环境务必更换 secret）
jwt:
  secret: digital-mall-secret-key-please-change-in-production-0123456789
  expire-hours: 24

# 大模型导购配置（OpenAI 兼容接口）
# api-key 不写死：优先读环境变量 LLM_API_KEY，未配置时保持占位符 → 导购自动降级为本地检索模式
# 真实密钥请写到 application-local.yml（该文件已被 .gitignore 忽略，不会提交到 Git）
llm:
  base-url: ${LLM_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  api-key: ${LLM_API_KEY:your-api-key}
  model: ${LLM_MODEL:doubao-pro-32k}
  embedding-model: ${LLM_EMBEDDING_MODEL:doubao-embedding}
